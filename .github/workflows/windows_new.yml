name: Windows latest

on: [push, workflow_dispatch]

jobs:

  build-windows:

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          make
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-libusb-compat-git
          mingw-w64-x86_64-hidapi

    - name: make
      run: make TARGETOS=windows

    # msigd.exe links MinGW runtime and libraries dynamically; ship them alongside
    - name: Collect runtime DLLs
      run: |
        mkdir dist
        cp msigd.exe dist/
        ldd msigd.exe | awk '$3 ~ /^\/mingw64\// {print $3}' | xargs -r cp -t dist/
        ls dist

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: msigd-windows-x86_64
        path: dist/
